<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Installation Estimator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="calculator-card">
    <h2>Solar Cost Estimator</h2>
    <p>Select your usage to calculate an instant system estimate.</p>

    <div class="field">
      <label for="monthly-bill">Monthly Electricity Spend:</label>
      <select id="monthly-bill">
        <option value="1500">R1,500 / month</option>
        <option value="3000" selected>R3,000 / month</option>
        <option value="5000">R5,000 / month</option>
      </select>
    </div>

    <div class="field">
      <label for="battery-backup">Require Loadshedding Battery Backup?</label>
      <select id="battery-backup">
        <option value="yes" selected>Yes (Full Backup)</option>
        <option value="no">No (Grid-Tied Only)</option>
      </select>
    </div>

    <div class="result-box">
      <span>Estimated Investment:</span>
      <h3 id="price-display">R 0</h3>
    </div>

    <form action="https://formspree.io/f/FORMSPREE_ID" method="POST">
      <!-- Hidden inputs capture JavaScript calculated values -->
      <input type="hidden" name="calculated_estimate" id="hidden-estimate">
      <input type="hidden" name="selected_bill" id="hidden-bill">

      <div class="field">
        <input type="text" name="full_name" placeholder="Your Name" required>
      </div>
      <div class="field">
        <input type="email" name="email" placeholder="Your Email Address" required>
      </div>
      <button type="submit" class="submit-btn">Email Me This Estimate</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
